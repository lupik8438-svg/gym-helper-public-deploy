# Render Blueprint: one public website + one Telegram Mini App, sharing an isolated demo DB.
services:
  - type: web
    name: gym-helper-public-site
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt -r website/requirements.txt
    startCommand: gunicorn --chdir website app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gym-helper-demo-db
          property: connectionString
      - key: PUBLIC_DEMO_MODE
        value: "True"
      - key: DEBUG
        value: "False"
      - key: ADMIN_KEY
        generateValue: true
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: gym-helper-mini-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt -r website/requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker webapp.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gym-helper-demo-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: REQUIRE_WEBAPP_AUTH
        value: "True"
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false

 databases:
  - name: gym-helper-demo-db
    plan: free
