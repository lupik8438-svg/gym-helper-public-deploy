# Render Blueprint: public site and Telegram Mini App with one isolated PostgreSQL database.
# The bot can remain local initially; after deployment set WEBAPP_PUBLIC_URL to the Mini App URL
# and restart the bot so its Telegram menu button points to the deployed app.
services:
  - type: web
    name: gym-helper-public-site
    runtime: python
    plan: free
    healthCheckPath: /healthz
    buildCommand: pip install -r requirements.txt -r website/requirements.txt
    startCommand: gunicorn --chdir website app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gym-helper-production-db
          property: connectionString
      - key: PUBLIC_DEMO_MODE
        value: "False"
      - key: PUBLIC_SITE_URL
        value: "https://gym-helper-public-site.onrender.com"
      - key: DEBUG
        value: "False"
      - key: ADMIN_KEY
        generateValue: true
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: gym-helper-mini-app
    runtime: python
    plan: free
    healthCheckPath: /healthz
    buildCommand: pip install -r requirements.txt -r website/requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker webapp.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gym-helper-production-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: REQUIRE_WEBAPP_AUTH
        value: "True"
      - key: WEBAPP_PUBLIC_URL
        value: "https://gym-helper-mini-app.onrender.com"
      - key: PUBLIC_SITE_URL
        value: "https://gym-helper-public-site.onrender.com"
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: gym-helper-production-db
    plan: free
